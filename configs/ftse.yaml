# ---------------------------------------------------------------
# DeepVaR Sentinel – FTSE 100 (^FTSE) — UK market / Brexit vol
# ---------------------------------------------------------------
data:
  ticker: "^FTSE"
  source: "yfinance"
  csv_path: null
  start: "2015-01-01"
  end: null
  vol_window: 21
  target_horizon: 1
  train_end: "2021-12-31"
  val_end: "2023-12-31"

model:
  window: 60
  hidden1: 64
  hidden2: 32
  dropout: 0.35
  lr: 0.0005             # FTSE is low-vol like S&P — apply same anti-overfitting tuning
  batch_size: 64
  epochs: 60
  patience: 10
  seed: 42

risk:
  confidence: 0.99
  portfolio_value: 1000000
  mu: 0.0
  distribution: "t"
  t_df: 5
  hist_window: 250
  ewma_lambda: 0.94

security:
  max_abs_return: 0.12       # FTSE is a low-volatility index
  collapse_window: 5
  collapse_ratio: 0.35
  hold_days: 21
  ref_window: 60
